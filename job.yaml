resources:
  jobs:
    V_Credit_Case:
      name: V-Credit-Case
      tasks:
        - task_key: bronze-atendentes
          notebook_task:
            notebook_path: to_Bronze/atendentes
            base_parameters:
              catalog: v_credit_case
              source_folder: atendentes
              table_name: tb_atendentes
            source: GIT
        - task_key: bronze-canais
          notebook_task:
            notebook_path: to_Bronze/canais
            base_parameters:
              catalog: v_credit_case
              source_folder: canais
              table_name: tb_canais
            source: GIT
        - task_key: bronze-chamados
          notebook_task:
            notebook_path: to_Bronze/chamados
            base_parameters:
              catalog: v_credit_case
              source_folder: chamados
              table_name: tb_chamados
            source: GIT
        - task_key: bronze-chamados-hora
          notebook_task:
            notebook_path: to_Bronze/chamados_hora
            base_parameters:
              catalog: v_credit_case
              source_folder: chamados_hora
              table_name: tb_chamados_hora
            source: GIT
        - task_key: bronze-clientes
          notebook_task:
            notebook_path: to_Bronze/clientes
            base_parameters:
              catalog: v_credit_case
              source_folder: clientes
              table_name: tb_clientes
            source: GIT
        - task_key: bronze-custos
          notebook_task:
            notebook_path: to_Bronze/custos
            base_parameters:
              catalog: v_credit_case
              source_folder: custos
              table_name: tb_custos
            source: GIT
        - task_key: bronze-motivos
          notebook_task:
            notebook_path: to_Bronze/motivos
            base_parameters:
              catalog: v_credit_case
              source_folder: motivos
              table_name: tb_motivos
            source: GIT
        - task_key: bronze-pesquisas-de-satisfacao
          notebook_task:
            notebook_path: to_Bronze/pesquisas_de_satisfacao
            base_parameters:
              catalog: v_credit_case
              source_folder: pesquisas_de_satisfacao
              table_name: tb_pesquisas_de_satisfacao
            source: GIT
        - task_key: silver-canais
          depends_on:
            - task_key: bronze-canais
          notebook_task:
            notebook_path: to_Silver/canais
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_canais
              silver_table_name: tb_canais
            source: GIT
          environment_key: Default
        - task_key: silver-custos
          depends_on:
            - task_key: bronze-custos
          notebook_task:
            notebook_path: to_Silver/custos
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_custos
              silver_table_name: tb_custos
            source: GIT
          environment_key: Default
        - task_key: silver-motivos
          depends_on:
            - task_key: bronze-motivos
          notebook_task:
            notebook_path: to_Silver/motivos
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_motivos
              silver_table_name: tb_motivos
            source: GIT
          environment_key: Default
        - task_key: silver-atendentes
          depends_on:
            - task_key: bronze-atendentes
          notebook_task:
            notebook_path: to_Silver/atendentes
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_atendentes
              silver_table_name: tb_atendentes
            source: GIT
          environment_key: Default
        - task_key: silver-clientes
          depends_on:
            - task_key: bronze-clientes
          notebook_task:
            notebook_path: to_Silver/clientes
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_clientes
              silver_table_name: tb_clientes
            source: GIT
          environment_key: Default
        - task_key: silver-chamados
          depends_on:
            - task_key: bronze-chamados
            - task_key: silver-canais
            - task_key: silver-motivos
            - task_key: silver-atendentes
            - task_key: silver-clientes
          notebook_task:
            notebook_path: to_Silver/chamados
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_chamados
              silver_table_name: tb_chamados
            source: GIT
          environment_key: Default
        - task_key: silver-pesquisas-de-satisfacao
          depends_on:
            - task_key: bronze-pesquisas-de-satisfacao
            - task_key: silver-chamados
          notebook_task:
            notebook_path: to_Silver/pesquisas_de_satisfacao
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_pesquisas_de_satisfacao
              silver_table_name: tb_pesquisas_de_satisfacao
            source: GIT
          environment_key: Default
        - task_key: silver-chamados-hora
          depends_on:
            - task_key: bronze-chamados-hora
          notebook_task:
            notebook_path: to_Silver/chamados_hora
            base_parameters:
              catalog: v_credit_case
              bronze_table_name: tb_chamados_hora
              silver_table_name: tb_chamados_hora
            source: GIT
          environment_key: Default
        - task_key: gold-data
          depends_on:
            - task_key: silver-chamados-hora
          notebook_task:
            notebook_path: to_Gold/dim_data
            base_parameters:
              catalog: v_credit_case
              silver_table_name: tb_chamados_hora
              gold_table_name: dim_data
            source: GIT
          environment_key: gold_dim_data_environment
        - task_key: gold-canal
          depends_on:
            - task_key: silver-canais
          notebook_task:
            notebook_path: to_Gold/dim_canal
            base_parameters:
              catalog: v_credit_case
              silver_table_name: tb_canais
              gold_table_name: dim_canal
            source: GIT
          environment_key: Default
        - task_key: gold-cliente
          depends_on:
            - task_key: silver-clientes
          notebook_task:
            notebook_path: to_Gold/dim_cliente
            base_parameters:
              catalog: v_credit_case
              silver_table_name: tb_clientes
              gold_table_name: dim_cliente
            source: GIT
          environment_key: Default
        - task_key: gold-hora
          depends_on:
            - task_key: silver-chamados-hora
          notebook_task:
            notebook_path: to_Gold/dim_horario
            base_parameters:
              catalog: v_credit_case
              gold_table_name: dim_horario
            source: GIT
          environment_key: Default
        - task_key: gold-atendente
          depends_on:
            - task_key: silver-atendentes
          notebook_task:
            notebook_path: to_Gold/dim_atendente
            base_parameters:
              catalog: v_credit_case
              silver_table_name: tb_atendentes
              gold_table_name: dim_atendente
            source: GIT
          environment_key: Default
        - task_key: gold-motivo
          depends_on:
            - task_key: silver-motivos
          notebook_task:
            notebook_path: to_Gold/dim_motivo
            base_parameters:
              catalog: v_credit_case
              silver_table_name: tb_motivos
              gold_table_name: dim_motivo
            source: GIT
          environment_key: Default
        - task_key: gold-fato-chamado
          depends_on:
            - task_key: silver-chamados
            - task_key: silver-chamados-hora
            - task_key: silver-custos
            - task_key: silver-pesquisas-de-satisfacao
            - task_key: gold-cliente
            - task_key: gold-atendente
            - task_key: gold-canal
            - task_key: gold-motivo
            - task_key: gold-data
            - task_key: gold-hora
          notebook_task:
            notebook_path: to_Gold/fato_chamado
            base_parameters:
              catalog: v_credit_case
              gold_table_name: fato_chamado
              silver_chamados_table_name: tb_chamados
              silver_custos_table_name: tb_custos
              silver_notas_table_name: tb_pesquisas_de_satisfacao
              gold_cliente_table_name: dim_cliente
              gold_atendente_table_name: dim_atendente
              gold_canal_table_name: dim_canal
              gold_motivo_table_name: dim_motivo
              gold_data_table_name: dim_data
              gold_horario_table_name: dim_horario
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/luigi-rangel/v-credit-case
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: gold_dim_data_environment
          spec:
            dependencies:
              - holidays == 0.106
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED